name: CI/CD Pipeline - Despliegue Automático a Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # JOB 1: Build (lo tenías)
  build:
    runs-on: ubuntu-latest
    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v3
      
      - name:  Construir imagen Docker
        run: docker build -t mi-app .
      
      - name:  Probar contenedor
        run: |
          docker run -d -p 8080:80 --name test-container mi-app
          sleep 3
          curl --fail http://localhost:8080 || exit 1
          echo " Prueba exitosa"
          docker stop test-container
          docker rm test-container

  # JOB 2: Escaneo de vulnerabilidades (NUEVO)
  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v3
      
      - name:  Construir imagen Docker
        run: docker build -t mi-app .
      
      - name:  Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mi-app
          format: table
          exit-code: 0
          severity: CRITICAL
      
      - name:  Escaneo completado
        run: echo "Escaneo de vulnerabilidades finalizado"

  # JOB 3: Publicar a Docker Hub (NUEVO)
  publish:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v3
      
      - name:  Login a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name:  Construir y publicar imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
      
      - name:  Publicación completada
        run: echo "Imagen publicada en Docker Hub"

  # JOB 4: Desplegar a Azure (lo tenías)
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v3
      
      - name:  Desplegar a Azure VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            cd /home/azureuser/proyecto-devops || git clone https://github.com/Zamora195/proyecto-devops.git /home/azureuser/proyecto-devops
            cd /home/azureuser/proyecto-devops
            git pull
            docker stop mi-app || true
            docker rm mi-app || true
            docker build -t mi-app .
            docker run -d -p 80:80 --name mi-app mi-app
            echo " Despliegue completado"