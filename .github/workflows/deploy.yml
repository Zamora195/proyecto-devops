name: CI/CD Pipeline - Despliegue Automático a Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
      
      - name: Construir imagen Docker
        run: docker build -t mi-app .
      
      - name: Probar contenedor
        run: |
          docker run -d -p 8080:80 --name test-container mi-app
          sleep 3
          curl --fail http://localhost:8080 || exit 1
          docker stop test-container
          docker rm test-container
      
      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: mi-app
          format: table
          exit-code: 0
      
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Publicar imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
      
      - name: Desplegar a Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
            docker stop mi-app || true
            docker rm mi-app || true
            docker run -d -p 80:80 --name mi-app ${{ secrets.DOCKER_USERNAME }}/mi-app:latest