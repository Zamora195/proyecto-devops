name: CI/CD Pipeline - Despliegue Automático a Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar repositorio
      - name:  Clonar repositorio
        uses: actions/checkout@v3
      
      # 2. Construir imagen Docker
      - name: Construir imagen Docker
        run: docker build -t mi-app .
      
      # 3. Probar contenedor
      - name:  Probar contenedor
        run: |
          docker run -d -p 8080:80 --name test-container mi-app
          sleep 3
          curl --fail http://localhost:8080 || exit 1
          echo "Prueba exitosa"
          docker stop test-container
          docker rm test-container
      
      # 4. Escaneo de vulnerabilidades (Trivy)
      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mi-app
          format: table
          exit-code: 0
          severity: CRITICAL
      
      # 5. Publicar a Docker Hub
      - name: Publicar imagen a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build y push a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
      
      # 6. Desplegar a Azure VM
      - name: Desplegar a Azure VM
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            cd /home/azureuser/proyecto-devops || git clone https://github.com/Zamora195/proyecto-devops.git /home/azureuser/proyecto-devops
            cd /home/azureuser/proyecto-devops
            git pull
            docker pull ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
            docker stop mi-app || true
            docker rm mi-app || true
            docker run -d -p 80:80 --name mi-app ${{ secrets.DOCKER_USERNAME }}/mi-app:latest
            echo "Despliegue completado"