name: CI/CD Pipeline - Despliegue Automático a Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
      
      - name: Desplegar a Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            cd /home/azureuser/proyecto-devops || git clone https://github.com/Zamora195/proyecto-devops.git /home/azureuser/proyecto-devops
            cd /home/azureuser/proyecto-devops
            git pull
            docker stop mi-app 2>/dev/null || true
            docker rm mi-app 2>/dev/null || true
            docker run -d --name mi-app -p 80:80 -v $(pwd):/usr/share/nginx/html:ro nginx:alpine
            echo " Despliegue completado"